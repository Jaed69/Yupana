# Yupana on the shared VPS. Traefik (from luciel-platform) owns the external
# traefik-public network and TLS; only the api joins it.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Shared by every process of the single Go image.
x-app: &app
  image: ${YUPANA_IMAGE:-yupana:local}
  build: .
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  environment: &app-env
    YUPANA_ENV: prod
    YUPANA_LOG_LEVEL: ${YUPANA_LOG_LEVEL:-info}
    # The app role is subject to row-level security; it owns nothing.
    YUPANA_DATABASE_URL: postgres://yupana_app:${YUPANA_APP_DB_PASSWORD:?YUPANA_APP_DB_PASSWORD is required}@postgres:5432/yupana
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp
  logging: *default-logging

x-app-healthcheck: &app-healthcheck
  test: ["CMD", "/yupana", "healthcheck", "http://127.0.0.1:8080/healthz"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_DB: yupana
      # Superuser that owns the schema: used only by migrate and backup.
      POSTGRES_USER: yupana_owner
      POSTGRES_PASSWORD: ${YUPANA_OWNER_DB_PASSWORD:?YUPANA_OWNER_DB_PASSWORD is required}
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "yupana_owner", "-d", "yupana"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # The entrypoint fixes data-dir ownership, then drops to the postgres user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    shm_size: 128m
    mem_limit: 1g
    logging: *default-logging

  # One-shot: applies migrations as the owner and sets the app role password.
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      YUPANA_MIGRATE_DATABASE_URL: postgres://yupana_owner:${YUPANA_OWNER_DB_PASSWORD:?YUPANA_OWNER_DB_PASSWORD is required}@postgres:5432/yupana
      YUPANA_APP_DB_PASSWORD: ${YUPANA_APP_DB_PASSWORD:?YUPANA_APP_DB_PASSWORD is required}
    mem_limit: 128m

  api:
    <<: *app
    command: ["api"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 200MiB
    networks:
      - backend
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.yupana-api.rule=Host(`${YUPANA_API_HOST:?YUPANA_API_HOST is required}`)"
      - "traefik.http.routers.yupana-api.entrypoints=websecure"
      - "traefik.http.routers.yupana-api.tls.certresolver=le"
      - "traefik.http.services.yupana-api.loadbalancer.server.port=8080"
    healthcheck: *app-healthcheck
    mem_limit: 256m

  worker:
    <<: *app
    command: ["worker"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 200MiB
    healthcheck: *app-healthcheck
    mem_limit: 256m

  bot:
    <<: *app
    command: ["bot"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 100MiB
      YUPANA_TELEGRAM_TOKEN: ${YUPANA_TELEGRAM_TOKEN:-}
    healthcheck: *app-healthcheck
    mem_limit: 128m

  # Daily pg_dump in custom format, pruned after BACKUP_KEEP_DAYS.
  backup:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    # Writes to ./backups as the host user, so the files can be copied off-site.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGDATABASE: yupana
      PGUSER: yupana_owner
      PGPASSWORD: ${YUPANA_OWNER_DB_PASSWORD:?YUPANA_OWNER_DB_PASSWORD is required}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      # Must exist and belong to BACKUP_UID: a directory dockerd creates is
      # root-owned, and every dump would fail.
      - type: bind
        source: ./backups
        target: /backups
        bind:
          create_host_path: false
    networks:
      - backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    logging: *default-logging

volumes:
  pgdata:

networks:
  backend:
  traefik-public:
    external: true
